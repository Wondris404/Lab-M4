name: CI
on:
  pull_request:
  push:
    branches: [feat/wraith-base, feat/rebrand, feat/usage-backend, feat/usage-ui, feat/orchestrator-core, feat/orchestrator-ui, feat/orchestrator-more-agents]
permissions:
  contents: read
jobs:
  node:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.2
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm package:usage-sidecar
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
  desktop:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.2
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir ../.. package:usage-sidecar
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - run: pnpm tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: lab-m4-windows-x64
          path: apps/desktop/src-tauri/target/release/bundle
