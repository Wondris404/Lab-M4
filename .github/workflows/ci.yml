name: CI
on:
  pull_request:
permissions:
  contents: read
jobs:
  node:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.2
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm package:usage-sidecar
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:orchestrator
  desktop:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.2
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir ../.. package:usage-sidecar
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: rustc --edition 2021 ../../packages/orchestrator-core/native/job_stop.rs -o job-stop-proof.exe
      - run: ./job-stop-proof.exe --self-test
      - run: rustc --edition 2021 ../../packages/orchestrator-core/native/supervisor_test.rs -o job-supervisor-test.exe
      - run: ./job-supervisor-test.exe
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      # This explicit native ConPTY smoke does not exercise the Tauri GUI.
      - name: PowerShell PTY smoke (Windows)
        timeout-minutes: 3
        run: cargo test --manifest-path src-tauri/Cargo.toml --test terminal_pty_smoke -- --ignored --nocapture
      - run: pnpm tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: lab-m4-windows-x64
          path: apps/desktop/src-tauri/target/release/bundle
  windows-webdriver:
    # The Server 2025 image can start WebView2 without exposing its DevTools
    # port, so EdgeDriver never completes POST /session. See runner-images#14738.
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.2
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Tauri WebDriver
        run: cargo install tauri-driver --version 2.1.0 --locked
      - name: Match EdgeDriver to the installed WebView2 runtime
        shell: pwsh
        run: |
          $client = 'Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
          $versions = @(
            Get-ItemPropertyValue -LiteralPath "HKCU:\SOFTWARE\$client" -Name pv -ErrorAction SilentlyContinue
            Get-ItemPropertyValue -LiteralPath "HKLM:\SOFTWARE\WOW6432Node\$client" -Name pv -ErrorAction SilentlyContinue
          ) | Where-Object { $_ -match '^[1-9]\d*\.\d+\.\d+\.\d+$' } | Select-Object -Unique
          if (@($versions).Count -ne 1) {
            throw 'Expected a single identifiable WebView2 runtime version on the GUI runner.'
          }
          $runtime = @($versions)[0]
          $compatible = '^Microsoft Edge WebDriver ' + [regex]::Escape(($runtime -split '\.' | Select-Object -First 3) -join '.') + '\.'
          $driver = if ($env:EDGEWEBDRIVER) { Join-Path $env:EDGEWEBDRIVER 'msedgedriver.exe' }
          if (-not $driver -or -not (Test-Path -LiteralPath $driver) -or (& $driver --version) -notmatch $compatible) {
            $download = Join-Path $env:RUNNER_TEMP 'lab-m4-edge-driver'
            New-Item -ItemType Directory -Path $download | Out-Null
            $zip = Join-Path $download 'driver.zip'
            Invoke-WebRequest -Uri "https://msedgedriver.microsoft.com/$runtime/edgedriver_win64.zip" -OutFile $zip -TimeoutSec 60
            Expand-Archive -LiteralPath $zip -DestinationPath $download
            $driver = Join-Path $download 'msedgedriver.exe'
          }
          $driverVersion = & $driver --version
          if ($LASTEXITCODE -ne 0 -or $driverVersion -notmatch $compatible) {
            throw "EdgeDriver version '$driverVersion' does not match WebView2 $runtime."
          }
          Write-Output "WebView2 $runtime | $driverVersion"
          "TAURI_NATIVE_DRIVER=$driver" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Build isolated debug app
        run: pnpm tauri build --debug --no-bundle
      - name: Exercise terminal and window through WebDriver
        shell: pwsh
        run: |
          $env:TAURI_DRIVER = Join-Path $HOME '.cargo/bin/tauri-driver.exe'
          node scripts/windows-webdriver-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: lab-m4-webdriver-diagnostics
          path: .lab-m4/webdriver-artifacts
          if-no-files-found: ignore
